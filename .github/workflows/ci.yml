name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.12"
          package-manager-cache: false

      - name: Test Go packages
        run: go test ./...

      - name: Vet Go packages
        run: go vet ./...

      - name: Check JavaScript syntax
        run: npm run check:js

      - name: Check Python syntax
        run: npm run check:python

      - name: Check native launcher syntax
        run: xcrun clang -fsyntax-only -Wall -Wextra native/launcher.c

      - name: Check installer syntax
        run: npm run check:shell

      - name: Check release metadata
        run: npm run release:check

  windows-go-core:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Test Go packages
        run: go test ./...

      - name: Vet Go packages
        run: go vet ./...

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.12"
          package-manager-cache: false

      - name: Install ASAR build dependency
        run: npm ci --ignore-scripts

      - name: Build codex-mux
        run: go build ./cmd/codex-mux

      - name: Build Windows launcher
        run: go build ./cmd/codex-router-launcher

      - name: Check Windows patcher syntax
        run: python -m compileall -q scripts

      - name: Test Windows patcher helpers
        shell: pwsh
        run: |
          $output = @(& python -m unittest discover -s scripts/tests -p "test_*.py" 2>&1)
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) {
            $details = ($output |
              Where-Object { $_ -match 'FAIL|ERROR|Traceback|AssertionError|Ran |FAILED' } |
              ForEach-Object { $_.ToString().Trim() }) -join ' | '
            if ([string]::IsNullOrWhiteSpace($details)) {
              $details = "Windows helper tests exited with code $exitCode"
            }
            $details = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            if ($details.Length -gt 6000) {
              $details = $details.Substring(0, 6000)
            }
            Write-Output "::error file=scripts/tests/test_windows_desktop.py::$details"
            exit $exitCode
          }
